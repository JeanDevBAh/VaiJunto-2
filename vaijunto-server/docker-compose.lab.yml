services:
  empresa-a:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaijunto-empresa-a
    environment:
      EMPRESA_ID: EMPRESA_A
      PORTA_TCP: 8080
      PORTA_HTTP: 7070
      DATA_DIR: /data/empresa_a
      CONSORCIO_TOKEN: vaijunto-local-token
      PEERS: EMPRESA_B=http://empresa-b:7071,EMPRESA_C=http://empresa-c:7072
    ports:
      - "8080:8080"
      - "7070:7070"
    volumes:
      - ./data-lab/empresa_a:/data/empresa_a
    restart: unless-stopped

  empresa-b:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaijunto-empresa-b
    environment:
      EMPRESA_ID: EMPRESA_B
      PORTA_TCP: 8081
      PORTA_HTTP: 7071
      DATA_DIR: /data/empresa_b
      CONSORCIO_TOKEN: vaijunto-local-token
      PEERS: EMPRESA_A=http://empresa-a:7070,EMPRESA_C=http://empresa-c:7072
    ports:
      - "8081:8081"
      - "7071:7071"
    volumes:
      - ./data-lab/empresa_b:/data/empresa_b
    restart: unless-stopped

  empresa-c:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaijunto-empresa-c
    environment:
      EMPRESA_ID: EMPRESA_C
      PORTA_TCP: 8082
      PORTA_HTTP: 7072
      DATA_DIR: /data/empresa_c
      CONSORCIO_TOKEN: vaijunto-local-token
      PEERS: EMPRESA_A=http://empresa-a:7070,EMPRESA_B=http://empresa-b:7071
    ports:
      - "8082:8082"
      - "7072:7072"
    volumes:
      - ./data-lab/empresa_c:/data/empresa_c
    restart: unless-stopped
